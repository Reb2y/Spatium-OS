<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- Добавлен запрет масштабирования для мобилок (чтобы экран не зумился при двойном тапе) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spatium OS - Ретро CRT Терминал</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="crt-screen power-on" id="screen">
        <div class="crt-overlay">
            <div class="scanlines"></div>
            <div class="vignette"></div>
            <div class="glass-glare"></div>
            <div class="glitch-line" id="glitchLine"></div>
        </div>

        <div class="boot-container" id="bootContainer">
            <div class="logo-loader">
                <span class="static-s">S</span>
                <div class="progress-underscore">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>
            <div class="boot-status" id="bootStatus">ИНИЦИАЛИЗАЦИЯ SPATIUM OS...</div>
        </div>

        <div class="terminal-container hidden" id="terminalContainer">
            <div class="logo-wrapper" id="logoWrapper" title="Открыть аудиоплеер">
                <span class="static-s">S</span><span class="blinking-underscore">_</span>
            </div>

            <div class="terminal-output" id="terminalOutput">
                <div class="system-msg">СИСТЕМА ГОТОВА К РАБОТЕ. ВВЕДИТЕ 'help' ДЛЯ СПИСКА КОМАНД.</div>
            </div>

            <div class="input-line">
                <span class="prompt">&gt;&nbsp;</span>
                <div class="input-wrapper">
                    <!-- Скрытый инпут для вызова мобильной клавиатуры -->
                    <input type="text" id="hiddenInput" class="hidden-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
                    <span id="commandInputText"></span><span class="terminal-cursor"></span>
                </div>
            </div>
        </div>

        <div id="musicPlayerModal" class="music-player-modal hidden">
            <div class="player-header">
                <span class="player-title">SPATIUM PLAYER</span>
                <button id="playerCloseBtn" class="player-close-btn">[X]</button>
            </div>
            <div class="track-info">
                <div id="trackName" class="track-name">1. Console OST</div>
                <div class="time-display">
                    <span id="currentTime">00:00</span> / <span id="durationTime">00:00</span>
                </div>
            </div>
            <div class="seekbar-container">
                <input type="range" id="seekBar" class="custom-slider" value="0" min="0" max="100">
            </div>
            <div class="player-controls">
                <button id="btnPrev" class="player-btn">PREV</button>
                <button id="btnPlayPause" class="player-btn">PLAY</button>
                <button id="btnNext" class="player-btn">NEXT</button>
            </div>
            <div class="volume-container">
                <button id="btnMute" class="player-btn mute-btn">VOL</button>
                <input type="range" id="volumeBar" class="custom-slider" value="0.009" min="0" max="1" step="0.01">
            </div>
            <div id="playlistContainer" class="playlist-container">
                <!-- Список треков генерируется скриптом -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
